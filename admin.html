<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運動防護物資管理與現場領用站 • 雲端即時連動</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center font-black">⚡</div>
        <div>
          <h1 class="text-base font-black text-slate-900">運動防護物資管理系統</h1>
          <p class="text-[11px] text-slate-500">現場領用站 ⇄ 總管後台 ⇄ Google 試算表雲端即時連動</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="switchTab('staff')" id="btnStaff" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-teal-700 text-white shadow-xs">📋 現場領用站</button>
        <button onclick="switchTab('admin')" id="btnAdmin" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">📊 後台總管系統</button>
        <button onclick="syncWithCloud()" class="px-2.5 py-1.5 bg-teal-50 text-teal-800 rounded-lg text-xs font-bold border border-teal-200">⚡ 立即同步</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
    
    <!-- 現場領用區 -->
    <section id="viewStaff" class="space-y-4">
      <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
        <span class="text-xs font-bold text-slate-500">當前隨隊專案：</span>
        <select id="staffEventSelect" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-800 outline-none">
          <option value="苗栗計畫隨隊">苗栗計畫隨隊</option>
          <option value="桃園計畫隨隊">桃園計畫隨隊</option>
          <option value="其他活動備註">其他活動備註</option>
        </select>
      </div>

      <div class="bg-slate-900 text-white rounded-2xl p-4 shadow-sm grid grid-cols-2 gap-3 text-xs">
        <div>
          <label class="block font-bold text-amber-300 mb-1">借領單位 *</label>
          <input type="text" id="staffUnit" placeholder="例：田徑組" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-white outline-none">
        </div>
        <div>
          <label class="block font-bold text-slate-300 mb-1">姓名 *</label>
          <input type="text" id="staffUser" placeholder="例：林防護員" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-white outline-none">
        </div>
      </div>

      <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-3">
        <h2 class="text-sm font-black text-slate-900">📦 快速登記表單</h2>
        <form onsubmit="handlePortalSubmit(event)" class="space-y-3 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">選擇品項 *</label>
            <select id="formItem" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 font-semibold outline-none">
              <option value="皮膚保護膜-2.75 吋寬">皮膚保護膜-2.75 吋寬 (卷)</option>
              <option value="運動貼布-1.5 吋寬">運動貼布-1.5 吋寬 (卷)</option>
              <option value="肌內效貼布">肌內效貼布 (卷)</option>
              <option value="水泡護墊(2nd Skin)">水泡護墊(2nd Skin) (片)</option>
              <option value="生理食鹽水（小）">生理食鹽水（小） (瓶)</option>
              <option value="冰敷用塑膠袋">冰敷用塑膠袋 (包)</option>
              <option value="防護包">防護包 (個)</option>
              <option value="冰桶-大">冰桶-大 (個)</option>
              <option value="捲式鋁製夾板">捲式鋁製夾板 (卷)</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-slate-700 mb-1">動作類型 *</label>
              <select id="formAction" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 font-bold outline-none">
                <option value="領出">📦 領出 / 借出</option>
                <option value="歸還">🔄 歸還 / 退回</option>
              </select>
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">數量 *</label>
              <input type="number" id="formQty" min="1" value="1" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 font-bold outline-none">
            </div>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">備註說明</label>
            <input type="text" id="formNote" placeholder="例：腳踝固定" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 outline-none">
          </div>
          <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-3 rounded-xl font-bold shadow transition">
            確認送出至雲端試算表
          </button>
        </form>
      </div>
    </section>

    <!-- 後台總管區 -->
    <section id="viewAdmin" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-3">
        <h3 class="text-sm font-black text-slate-900">📊 雲端試算表即時流水明細與總表</h3>
        <div class="overflow-x-auto rounded-xl border border-slate-200">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                <th class="py-3 px-3">登記時間</th>
                <th class="py-3 px-3">活動專案</th>
                <th class="py-3 px-3">借領單位</th>
                <th class="py-3 px-3">經手人</th>
                <th class="py-3 px-3">動作</th>
                <th class="py-3 px-3">品項名稱</th>
                <th class="py-3 px-3 text-right">數量</th>
                <th class="py-3 px-3">備註</th>
              </tr>
            </thead>
            <tbody id="adminTableBody" class="divide-y divide-slate-100 text-slate-700">
              <tr><td colspan="8" class="py-8 text-center text-slate-400">正在向 Google 試算表讀取資料...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs font-bold hidden z-50"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyHQiFrc9kMv37JfCJScyJgPJDWxLTSeyd-rHfYTGFVw6m0360XxlpVeyLJapszsSuI/exec";

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    function switchTab(tab) {
      const staffSec = document.getElementById('viewStaff');
      const adminSec = document.getElementById('viewAdmin');
      const bStaff = document.getElementById('btnStaff');
      const bAdmin = document.getElementById('btnAdmin');

      if (tab === 'staff') {
        staffSec.classList.remove('hidden');
        adminSec.classList.add('hidden');
        bStaff.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-teal-700 text-white shadow-xs";
        bAdmin.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900";
      } else {
        staffSec.classList.add('hidden');
        adminSec.classList.remove('hidden');
        bAdmin.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-teal-700 text-white shadow-xs";
        bStaff.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900";
        syncWithCloud();
      }
    }

    function handlePortalSubmit(e) {
      e.preventDefault();
      const unit = document.getElementById('staffUnit').value.trim();
      const user = document.getElementById('staffUser').value.trim();
      if (!unit || !user) {
        showToast('請填寫借領單位與登記人姓名！');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.innerText = "⏳ 正在寫入 Google 試算表...";
      btn.disabled = true;

      const payload = {
        action: 'add',
        time: new Date().toLocaleString('zh-TW', { hour12: false }),
        eventName: document.getElementById('staffEventSelect').value,
        unit: unit,
        user: user,
        actionType: document.getElementById('formAction').value,
        itemName: document.getElementById('formItem').value,
        qty: document.getElementById('formQty').value,
        unitName: '個/卷',
        note: document.getElementById('formNote').value.trim()
      };

      const frameName = 'iframe_' + Date.now();
      const iframe = document.createElement('iframe');
      iframe.name = frameName;
      iframe.style.display = 'none';
      document.body.appendChild(iframe);

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = API_URL;
      form.target = frameName;
      form.style.display = 'none';

      Object.keys(payload).forEach(k => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = k;
        input.value = payload[k];
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();

      setTimeout(() => {
        document.body.removeChild(form);
        document.body.removeChild(iframe);
        btn.innerText = "確認送出至雲端試算表";
        btn.disabled = false;
        showToast('✅ 成功寫入 Google 試算表與總表！');
        document.getElementById('formQty').value = '1';
        document.getElementById('formNote').value = '';
        syncWithCloud();
      }, 1500);
    }

    function syncWithCloud() {
      const tbody = document.getElementById('adminTableBody');
      const script = document.createElement('script');
      const cbName = 'cb_' + Date.now();

      window[cbName] = function(res) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.status === 'success' && Array.isArray(res.data)) {
          if (res.data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="py-8 text-center text-slate-400">目前試算表尚無任何紀錄</td></tr>`;
            return;
          }
          tbody.innerHTML = res.data.reverse().map(l => `
            <tr class="hover:bg-slate-50 transition">
              <td class="py-3 px-3 font-mono text-slate-500">${l.time}</td>
              <td class="py-3 px-3 font-bold text-slate-900">${l.eventName}</td>
              <td class="py-3 px-3 font-bold text-amber-800">${l.unit}</td>
              <td class="py-3 px-3">${l.user}</td>
              <td class="py-3 px-3"><span class="px-2 py-0.5 rounded font-bold ${l.actionType.includes('領') ? 'bg-teal-100 text-teal-800' : 'bg-amber-100 text-amber-800'}">${l.actionType}</span></td>
              <td class="py-3 px-3 font-bold text-slate-900">${l.itemName}</td>
              <td class="py-3 px-3 text-right font-black text-teal-700">${l.qty} ${l.unitName}</td>
              <td class="py-3 px-3 text-slate-500">${l.note || '-'}</td>
            </tr>
          `).join('');
          showToast('✅ 成功從雲端同步最新紀錄！');
        }
      };

      script.src = `${API_URL}?callback=${cbName}&_t=${Date.now()}`;
      script.onerror = () => { showToast('雲端連線失敗'); };
      document.body.appendChild(script);
    }

    window.onload = function() { syncWithCloud(); };
  </script>
</body>
</html>
