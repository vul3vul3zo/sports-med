<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運動防護物資總管後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-6">
    <div class="max-w-5xl mx-auto bg-white p-6 shadow-lg rounded-2xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">📊 運動防護物資總管後台</h1>
            <button onclick="fetchCloudLogs()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-semibold shadow transition text-sm">
                ⚡ 立即從雲端重新整理
            </button>
        </div>

        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded-r-xl">
            <p class="text-sm text-blue-700">💡 提示：本後台已與中央 Google 試算表永久綁定。隨時點擊上方按鈕，即可同步抓取全場所有手機送出的最新領用紀錄。</p>
        </div>

        <h2 class="text-lg font-bold mb-3">📑 雲端即時流水明細</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-200 text-slate-700 text-sm">
                        <th class="p-3 border">時間</th>
                        <th class="p-3 border">活動專案</th>
                        <th class="p-3 border">借領單位</th>
                        <th class="p-3 border">登記人員</th>
                        <th class="p-3 border">異動類型</th>
                        <th class="p-3 border">品項名稱</th>
                        <th class="p-3 border text-center">數量</th>
                        <th class="p-3 border">備註</th>
                    </tr>
                </thead>
                <tbody id="logs-table-body" class="text-sm">
                    <tr><td colspan="8" class="p-4 text-center text-slate-400">正在自動載入雲端資料...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 永久寫死您的中央 API 網址
        const FIXED_API_URL = "https://script.google.com/macros/s/AKfycbzVQHj-Uh5FBCi1jl2dfqYCjHpzVhbOohlJC-3vbQ30wa16ij5y5EXGZQj8AsQfhGa7/exec";

        function fetchCloudLogs() {
            const tbody = document.getElementById('logs-table-body');
            tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-blue-500 font-bold">正在同步雲端資料...</td></tr>`;

            const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
            const script = document.createElement('script');
            script.src = `${FIXED_API_URL}?callback=${callbackName}&_t=${Date.now()}`;

            window[callbackName] = function(response) {
                delete window[callbackName];
                document.body.removeChild(script);

                if (response && response.status === "success" && response.data) {
                    renderTable(response.data);
                } else {
                    tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">載入失敗或尚無資料</td></tr>`;
                }
            };

            script.onerror = function() {
                delete window[callbackName];
                document.body.removeChild(script);
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-red-500">雲端連線失敗，請檢查網路</td></tr>`;
            };

            document.body.appendChild(script);
        }

        function renderTable(dataList) {
            const tbody = document.getElementById('logs-table-body');
            if (dataList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400">目前尚無任何登記紀錄</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            dataList.reverse().forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-3 border text-xs text-slate-500">${row.time || ''}</td>
                    <td class="p-3 border">${row.eventName || ''}</td>
                    <td class="p-3 border font-semibold">${row.unit || ''}</td>
                    <td class="p-3 border">${row.user || ''}</td>
                    <td class="p-3 border">
                        <span class="px-2.5 py-1 rounded-md text-xs font-semibold ${row.actionType==='耗材領出'||row.actionType==='器材借出'?'bg-amber-100 text-amber-800':'bg-emerald-100 text-emerald-800'}">
                            ${row.actionType || '領出'}
                        </span>
                    </td>
                    <td class="p-3 border font-bold text-blue-600">${row.itemName || ''}</td>
                    <td class="p-3 border text-center font-bold">${row.qty || 0} ${row.unitName || ''}</td>
                    <td class="p-3 border text-xs text-slate-500">${row.note || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = function() {
            fetchCloudLogs();
        };
    </script>
</body>
</html>
