<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運動防護物資 • 現場領用登記站</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f8fafc; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .fade-enter { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-teal-500 selection:text-white pb-10">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-700 to-teal-500 text-white flex items-center justify-center shadow-md">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
            </svg>
          </div>
          <div>
            <h1 class="text-base sm:text-lg font-black text-slate-900 leading-tight">現場物資領用登記站</h1>
            <p class="text-xs text-slate-500 font-medium">雲端直接連動 Google 試算表</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>☁️ 雲端同步中</span>
          </span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-5">
    <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-xl bg-teal-50 text-teal-700 flex items-center justify-center font-black text-lg">🎯</span>
        <div>
          <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">當前值勤隨隊專案</div>
          <select id="eventSelect" class="bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-xs sm:text-sm font-bold text-slate-800 outline-none mt-1">
            <option value="苗栗計畫隨隊">苗栗計畫隨隊</option>
            <option value="桃園計畫隨隊">桃園計畫隨隊</option>
            <option value="其他活動備註">其他活動備註</option>
          </select>
        </div>
      </div>
    </div>

    <div class="bg-slate-900 text-white rounded-2xl p-4 sm:p-5 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-xl bg-teal-500/20 text-teal-300 flex items-center justify-center font-bold text-lg">✍️</span>
        <div>
          <div class="text-xs text-slate-200 font-bold">登記單位與經手人設定</div>
          <div class="text-[11px] text-slate-400">每次送出會直接即時寫入 Google 試算表總部。</div>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-amber-300 shrink-0">借領單位 *</span>
          <input type="text" id="staffStationName" placeholder="例：田徑組" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white outline-none w-36">
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-slate-300 shrink-0">姓名 *</span>
          <input type="text" id="staffUserName" placeholder="例：林防護員" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white outline-none w-32">
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <div class="lg:col-span-5 bg-white rounded-2xl p-5 border border-slate-200 shadow-sm space-y-4">
        <h2 class="text-sm font-black text-slate-900 flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-teal-500"></span> 快速登記表單
        </h2>

        <form onsubmit="handleSubmit(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">選擇品項 *</label>
            <select id="formItemSelect" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold text-slate-800 outline-none">
              <optgroup label="🏷️ 貼紮用品類">
                <option value="皮膚保護膜-2.75 吋寬">皮膚保護膜-2.75 吋寬 (卷)</option>
                <option value="運動貼布-1.5 吋寬">運動貼布-1.5 吋寬 (卷)</option>
                <option value="輕型彈性貼布-2 吋寬">輕型彈性貼布-2 吋寬 (卷)</option>
                <option value="重型彈性貼布-2 吋寬">重型彈性貼布-2 吋寬 (卷)</option>
                <option value="重型彈性貼布-3 吋寬">重型彈性貼布-3 吋寬 (卷)</option>
                <option value="肌內效貼布">肌內效貼布 (卷)</option>
                <option value="膚色自黏貼布">膚色自黏貼布 (卷)</option>
                <option value="動態貼布-2 吋">動態貼布-2 吋 (卷)</option>
                <option value="動態貼布-3 吋">動態貼布-3 吋 (卷)</option>
                <option value="史崔普肌動態活力貼-2 吋">史崔普肌動態活力貼-2 吋 (卷)</option>
                <option value="史崔普肌動態活力貼-3 吋">史崔普肌動態活力貼-3 吋 (卷)</option>
                <option value="高密度黏性保護墊-1/8 吋厚">高密度黏性保護墊-1/8 吋厚 (片)</option>
                <option value="高密度黏性保護墊-1/4 吋厚">高密度黏性保護墊-1/4 吋厚 (片)</option>
                <option value="4 吋加長型彈繃">4 吋加長型彈繃 (卷)</option>
              </optgroup>
              <optgroup label="🩹 外傷處理類">
                <option value="水泡護墊(2nd Skin)">水泡護墊(2nd Skin) (片)</option>
                <option value="鼻血止血棉棒">鼻血止血棉棒 (盒/支)</option>
                <option value="酒精棉片">酒精棉片 (盒/片)</option>
                <option value="優碘棉片">優碘棉片 (盒/片)</option>
                <option value="防水透氣 OK 繃-一般型">防水透氣 OK 繃-一般型 (盒)</option>
                <option value="防水透氣 OK 繃-大型">防水透氣 OK 繃-大型 (盒)</option>
                <option value="生理食鹽水（小）">生理食鹽水（小） (瓶)</option>
                <option value="3M 透氣紙膠 1 吋">3M 透氣紙膠 1 吋 (卷)</option>
                <option value="3*3 吋滅菌紗布墊 (2 片裝)">3*3 吋滅菌紗布墊 (2 片裝) (包)</option>
                <option value="檢診手套(無粉)">檢診手套(無粉) (隻)</option>
                <option value="乾洗手">乾洗手 (瓶)</option>
                <option value="滅菌傷口清洗棉棒">滅菌傷口清洗棉棒 (包)</option>
              </optgroup>
              <optgroup label="🛠️ 其它與非耗材器材類">
                <option value="冰敷用塑膠袋">冰敷用塑膠袋 (包)</option>
                <option value="冰敷膠膜">冰敷膠膜 (卷)</option>
                <option value="熱身用運動軟膏">熱身用運動軟膏 (瓶)</option>
                <option value="防護包">防護包 (個)</option>
                <option value="冰桶-大">冰桶-大 (個)</option>
                <option value="冰桶-中">冰桶-中 (個)</option>
                <option value="可調式頸圈">可調式頸圈 (個)</option>
                <option value="折疊處理床">折疊處理床 (個)</option>
                <option value="捲式鋁製夾板">捲式鋁製夾板 (卷)</option>
                <option value="三折式關節夾板">三折式關節夾板 (個)</option>
                <option value="肢體固定三角巾">肢體固定三角巾 (條)</option>
              </optgroup>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">動作類型 *</label>
              <select id="formActionType" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold outline-none">
                <option value="領出">📦 領出 / 借出</option>
                <option value="歸還">🔄 歸還 / 退回</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">數量 *</label>
              <input type="number" id="formQty" min="1" value="1" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">備註說明</label>
            <input type="text" id="formNote" placeholder="例：腳踝固定" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs outline-none">
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-3 px-4 rounded-xl text-xs font-bold shadow transition">
            確認送出登記至雲端
          </button>
        </form>
      </div>

      <div class="lg:col-span-7 bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
          <h3 class="text-base font-bold text-slate-900">☁️ 雲端試算表最新即時紀錄</h3>
          <button onclick="fetchCloudLogs()" class="px-3 py-1 bg-teal-50 text-teal-700 rounded-lg text-xs font-bold border border-teal-200">重新整理</button>
        </div>
        <div id="cloudLogsList" class="custom-scroll space-y-2 max-h-[500px] overflow-y-auto text-xs flex-1">
          <div class="text-slate-400 text-center py-6">正在向雲端讀取紀錄...</div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs font-bold hidden"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyHQiFrc9kMv37JfCJScyJgPJDWxLTSeyd-rHfYTGFVw6m0360XxlpVeyLJapszsSuI/exec";

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    function handleSubmit(e) {
      e.preventDefault();
      const eventName = document.getElementById('eventSelect').value;
      const unit = document.getElementById('staffStationName').value.trim();
      const user = document.getElementById('staffUserName').value.trim();
      const itemName = document.getElementById('formItemSelect').value;
      const actionType = document.getElementById('formActionType').value;
      const qty = document.getElementById('formQty').value;
      const note = document.getElementById('formNote').value.trim();

      if (!unit || !user) {
        showToast('請填寫借領單位與登記人姓名！');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.innerText = "⏳ 正在寫入雲端試算表...";
      btn.disabled = true;

      const payload = {
        action: 'add',
        time: new Date().toLocaleString('zh-TW', { hour12: false }),
        eventName: eventName,
        unit: unit,
        user: user,
        actionType: actionType,
        itemName: itemName,
        qty: qty,
        unitName: '個/卷',
        note: note
      };

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = API_URL;
      form.target = '_blank';
      form.style.display = 'none';

      Object.keys(payload).forEach(k => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = k;
        input.value = payload[k];
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);

      setTimeout(() => {
        btn.innerText = "確認送出登記至雲端";
        btn.disabled = false;
        showToast('✅ 登記送出成功！已寫入 Google 試算表');
        document.getElementById('formQty').value = '1';
        document.getElementById('formNote').value = '';
        fetchCloudLogs();
      }, 1500);
    }

    function fetchCloudLogs() {
      const container = document.getElementById('cloudLogsList');
      const script = document.createElement('script');
      const cbName = 'cb_' + Date.now();

      window[cbName] = function(res) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (res && res.status === 'success' && Array.isArray(res.data)) {
          if (res.data.length === 0) {
            container.innerHTML = `<div class="text-slate-400 text-center py-6">尚無任何雲端紀錄</div>`;
            return;
          }
          container.innerHTML = res.data.reverse().map(l => `
            <div class="p-3 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-between">
              <div>
                <div class="font-bold text-slate-900">${l.itemName} <span class="text-teal-700 font-black">(${l.actionType} ${l.qty})</span></div>
                <div class="text-[11px] text-slate-500">${l.eventName} • [${l.unit}] ${l.user} • ${l.note || '無備註'}</div>
              </div>
              <div class="text-[10px] font-mono text-slate-400">${l.time}</div>
            </div>
          `).join('');
        }
      };

      script.src = `${API_URL}?callback=${cbName}&_t=${Date.now()}`;
      script.onerror = () => {
        container.innerHTML = `<div class="text-rose-600 text-center py-6">雲端連線失敗，請檢查網路</div>`;
      };
      document.body.appendChild(script);
    }

    window.onload = function() {
      fetchCloudLogs();
    };
  </script>
</body>
</html>
