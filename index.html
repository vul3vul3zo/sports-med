<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場物資領用登記站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    select { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-10">

  <header class="bg-white shadow-sm sticky top-0 z-10 border-b border-slate-200">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🛡️</span>
        <h1 class="text-lg font-black text-slate-800 tracking-wide">防護物資領用站</h1>
      </div>
      <div class="flex items-center gap-1.5 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-100">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-[11px] font-bold text-emerald-700">雲端連線中</span>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-5 fade-in">
    <form id="pickupForm" onsubmit="submitForm(event)" class="space-y-5 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      
      <!-- 活動專案 -->
      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">🎯 當前活動專案</label>
        <select id="eventName" required onchange="renderItemSelect()" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-bold rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition">
          <option value="115全民運">115全民運</option>
          <option value="苗栗計畫隨隊">苗栗計畫隨隊</option>
          <option value="桃園計畫隨隊">桃園計畫隨隊</option>
          <option value="其他專案活動">其他專案活動</option>
        </select>
      </div>

      <!-- 單位與人員 -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">🏢 借領單位/組別</label>
          <input type="text" id="unit" required placeholder="如: 田徑組" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-bold rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">👤 登記人員</label>
          <input type="text" id="user" required placeholder="您的姓名" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-bold rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition">
        </div>
      </div>

      <div class="pt-2 border-t border-slate-100">
        <div class="flex justify-between items-end mb-1.5">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">📦 選擇物資品項</label>
          <span id="syncStatusText" class="text-[10px] font-bold text-teal-600 bg-teal-50 px-2 py-0.5 rounded">🔄 抓取最新庫存中...</span>
        </div>
        <!-- 這裡的選單會在讀取雲端後自動補上現貨數量 -->
        <select id="itemName" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-bold rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition mb-4">
          <option value="" disabled selected>請先等待載入清單...</option>
        </select>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">🔄 異動類型</label>
            <select id="actionType" required class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-bold rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition">
              <option value="耗材領出">耗材領出 (消耗)</option>
              <option value="器材借出">器材借出 (未還)</option>
              <option value="歸還/退回">歸還 / 退回庫存</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">🔢 數量</label>
            <input type="number" id="qty" required min="1" value="1" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-lg text-center font-black rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition">
          </div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">📝 備註說明 (選填)</label>
        <input type="text" id="note" placeholder="例如：防護站補充、特定選手使用" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm font-bold rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-black text-lg py-4 rounded-xl shadow-lg shadow-teal-500/30 transition-all flex justify-center items-center gap-2 mt-4">
        <span>📤</span>
        <span>確認送出登記</span>
      </button>
    </form>
  </main>

  <script>
    // 🔗 永久寫死您的最新 API 網址
    const API_URL = "https://script.google.com/macros/s/AKfycby2Zn8aQivYlJW9gCPScQ6yd9H-7cc-qFt-2_CN-oHAtf1XJ8cYwIU6n18dU4mOh0Tx/exec";

    // 完整的品項分類基底資料
    const baseItems = [
      { name: '皮膚保護膜-2.75 吋寬', category: '貼紮用品', unit: '卷' },
      { name: '運動貼布-1.5 吋寬', category: '貼紮用品', unit: '卷' },
      { name: '輕型彈性貼布-2 吋寬', category: '貼紮用品', unit: '卷' },
      { name: '重型彈性貼布-2 吋寬', category: '貼紮用品', unit: '卷' },
      { name: '重型彈性貼布-3 吋寬', category: '貼紮用品', unit: '卷' },
      { name: '肌內效貼布', category: '貼紮用品', unit: '卷' },
      { name: '膚色自黏貼布', category: '貼紮用品', unit: '卷' },
      { name: '動態貼布-2 吋', category: '貼紮用品', unit: '卷' },
      { name: '動態貼布-3 吋', category: '貼紮用品', unit: '卷' },
      { name: '史崔普肌動態活力貼-2 吋', category: '貼紮用品', unit: '卷' },
      { name: '史崔普肌動態活力貼-3 吋', category: '貼紮用品', unit: '卷' },
      { name: '高密度黏性保護墊-1/8 吋厚', category: '貼紮用品', unit: '片' },
      { name: '高密度黏性保護墊-1/4 吋厚', category: '貼紮用品', unit: '片' },
      { name: '水泡護墊(2nd Skin)', category: '外傷處理', unit: '片' },
      { name: '鼻血止血棉棒', category: '外傷處理', unit: '支' },
      { name: '酒精棉片', category: '外傷處理', unit: '片' },
      { name: '優碘棉片', category: '外傷處理', unit: '片' },
      { name: '防水透氣 OK 繃-一般型', category: '外傷處理', unit: '片' },
      { name: '防水透氣 OK 繃-大型', category: '外傷處理', unit: '片' },
      { name: '生理食鹽水（小）', category: '外傷處理', unit: '瓶' },
      { name: '3M 透氣紙膠 1 吋', category: '外傷處理', unit: '卷' },
      { name: '3*3 吋滅菌紗布墊 (2 片裝)', category: '外傷處理', unit: '包' },
      { name: '檢診手套(無粉)', category: '外傷處理', unit: '隻' },
      { name: '乾洗手', category: '外傷處理', unit: '瓶' },
      { name: '滅菌傷口清洗棉棒', category: '外傷處理', unit: '包' },
      { name: '冰敷用塑膠袋', category: '其它', unit: '包' },
      { name: '冰敷膠膜', category: '其它', unit: '卷' },
      { name: '熱身用運動軟膏', category: '其它', unit: '瓶' },
      { name: '4 吋加長型彈繃', category: '其它', unit: '卷' },
      { name: '防護包', category: '非耗材(器材)', unit: '個' },
      { name: '冰桶-大', category: '非耗材(器材)', unit: '個' },
      { name: '冰桶-中', category: '非耗材(器材)', unit: '個' },
      { name: '可調式頸圈', category: '非耗材(器材)', unit: '個' },
      { name: '折疊處理床', category: '非耗材(器材)', unit: '個' },
      { name: '捲式鋁製夾板', category: '非耗材(器材)', unit: '卷' },
      { name: '三折式關節夾板', category: '非耗材(器材)', unit: '個' },
      { name: '肢體固定三角巾', category: '非耗材(器材)', unit: '條' }
    ];

    let inventoryCache = {};
    let globalLogs = []; // 新增：用來儲存從雲端抓下來的所有紀錄

    // 網頁載入時，自動抓取最新的現貨數量
    window.onload = function() {
      fetchInventory();
    };

    function fetchInventory() {
      const cbName = 'jsonp_init_' + Date.now();
      const script = document.createElement('script');
      script.src = `${API_URL}?callback=${cbName}&_t=${Date.now()}`;

      window[cbName] = function(res) {
        delete window[cbName];
        document.body.removeChild(script);

        if (res && res.status === "success" && res.data) {
          globalLogs = res.data; // 將所有雲端紀錄存起來
          
          // --- 新增：動態從雲端萃取活動名稱，更新下拉選單 ---
          const eventSelect = document.getElementById('eventName');
          const currentVal = eventSelect.value;
          const defaultEvents = ["115全民運", "苗栗計畫隨隊", "桃園計畫隨隊", "其他專案活動"];
          const logEvents = globalLogs.map(log => log.eventName).filter(e => e && e !== '所有計畫總表');
          const allEvents = [...new Set([...defaultEvents, ...logEvents])]; // 去除重複的專案
          
          eventSelect.innerHTML = '';
          allEvents.forEach(ev => {
             const opt = document.createElement('option');
             opt.value = ev;
             opt.innerText = ev;
             eventSelect.appendChild(opt);
          });
          
          if (allEvents.includes(currentVal)) {
              eventSelect.value = currentVal;
          }
          // ----------------------------------------------------
        }
        
        // 根據當前選擇的活動，計算現貨並渲染選單
        renderItemSelect();
        document.getElementById('syncStatusText').innerText = "✅ 已取得最新現貨數量";
      };

      document.body.appendChild(script);
    }

    // 將包含現貨數量的品項渲染到下拉選單 (加入活動篩選邏輯)
    function renderItemSelect() {
      const select = document.getElementById('itemName');
      const currentEvent = document.getElementById('eventName').value;
      
      // 初始化庫存為 0
      inventoryCache = {};
      baseItems.forEach(i => inventoryCache[i.name] = 0);
      
      // 只有屬於「當前選擇活動」的紀錄才進行計算
      globalLogs.filter(log => log.eventName === currentEvent).forEach(log => {
        let q = Number(log.qty);
        if (inventoryCache[log.itemName] !== undefined) {
          if (log.actionType === '後台盤點校正(領用區)' && log.note === '增加') inventoryCache[log.itemName] += q;
          else if (log.actionType === '後台盤點校正(領用區)' && log.note === '減少') inventoryCache[log.itemName] -= q;
          else if (log.actionType === '撥發至領用區') inventoryCache[log.itemName] += q;
          else if (log.actionType === '耗材領出' || log.actionType === '器材借出') inventoryCache[log.itemName] -= q;
          else if (log.actionType === '未用退回' || log.actionType === '器材歸還' || log.actionType === '歸還/退回') inventoryCache[log.itemName] += q;
        }
      });

      let html = '<option value="" disabled selected>請選擇領用物資...</option>';
      
      const categories = [...new Set(baseItems.map(i => i.category))];
      categories.forEach(cat => {
        html += `<optgroup label="🏷️ ${cat}">`;
        baseItems.filter(i => i.category === cat).forEach(item => {
          let currentQty = inventoryCache[item.name] || 0;
          let displayQty = currentQty > 0 ? currentQty : 0; // 防止負數顯示
          html += `<option value="${item.name}">${item.name} (現貨: ${displayQty} ${item.unit})</option>`;
        });
        html += `</optgroup>`;
      });
      
      select.innerHTML = html;
    }

    function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const itemSelect = document.getElementById('itemName');
      
      if (!itemSelect.value) {
        alert("⚠️ 請選擇要領用的物資品項！");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin">🔄</span> 資料同步中...`;

      // 取得選擇品項的單位
      const selectedItem = baseItems.find(i => i.name === itemSelect.value);
      
      // 自動判斷歸還的類型是耗材還是器材，以利總表精確對帳
      let finalActionType = document.getElementById('actionType').value;
      if (finalActionType === '歸還/退回') {
         finalActionType = (selectedItem && selectedItem.category === '非耗材(器材)') ? '器材歸還' : '未用退回';
      }

      const payload = {
        action: 'add',
        time: new Date().toLocaleString('zh-TW', { hour12: false }),
        eventName: document.getElementById('eventName').value,
        unit: document.getElementById('unit').value.trim(),
        user: document.getElementById('user').value.trim(),
        actionType: finalActionType,
        itemName: itemSelect.value,
        qty: document.getElementById('qty').value,
        unitName: selectedItem ? selectedItem.unit : '件',
        note: document.getElementById('note').value.trim(),
        _t: Date.now()
      };

      // 透過 JSONP 將資料安全穿透寫入 Google 試算表
      const cbName = 'tx_submit_' + Math.round(Math.random() * 1000000);
      const queryStr = Object.keys(payload).map(k => `${k}=${encodeURIComponent(payload[k])}`).join('&');
      const script = document.createElement('script');
      script.src = `${API_URL}?${queryStr}&callback=${cbName}`;

      window[cbName] = function(res) {
        delete window[cbName];
        document.body.removeChild(script);
        btn.disabled = false;
        btn.innerHTML = `<span>📤</span> <span>確認送出登記</span>`;
        
        if (res && res.status === "success") {
            alert(`✅ 登記成功！\n\n已將 [${payload.itemName} x ${payload.qty}] 同步至總部。`);
            // 重置部分表單
            itemSelect.value = '';
            document.getElementById('qty').value = '1';
            document.getElementById('note').value = '';
            // 重新抓取最新數量
            document.getElementById('syncStatusText').innerText = "🔄 重新計算庫存...";
            fetchInventory();
        } else {
            alert("⚠️ 雲端寫入失敗，請確認網路連線！");
        }
      };

      script.onerror = function() {
        delete window[cbName];
        document.body.removeChild(script);
        btn.disabled = false;
        btn.innerHTML = `<span>📤</span> <span>確認送出登記</span>`;
        alert("⚠️ 網路連線異常，無法連上 Google 雲端！");
      };

      document.body.appendChild(script);
    }
  </script>
</body>
</html>
