<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運動防護物資領用登記站</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 max-w-md mx-auto">
    <div class="bg-white p-6 shadow-lg rounded-2xl mt-4">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold text-slate-900">📋 現場物資領用登記</h1>
            <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full font-semibold">☁️ 永久雲端連線</span>
        </div>

        <form id="pickup-form" onsubmit="submitForm(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">活動專案</label>
                <select id="eventName" class="w-full border rounded-xl p-2.5 bg-slate-50">
                    <option value="苗栗計畫隨隊">苗栗計畫隨隊</option>
                    <option value="桃園計畫隨隊">桃園計畫隨隊</option>
                    <option value="其他專案活動">其他專案活動</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">借領單位</label>
                    <input type="text" id="unit" required placeholder="例如：防護組" class="w-full border rounded-xl p-2.5">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">登記人員</label>
                    <input type="text" id="user" required placeholder="您的姓名" class="w-full border rounded-xl p-2.5">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">異動類型</label>
                <select id="actionType" class="w-full border rounded-xl p-2.5 bg-slate-50">
                    <option value="耗材領出">耗材領出 (消耗)</option>
                    <option value="器材借出">器材借出 (未還)</option>
                    <option value="歸還/退回">歸還 / 未用退回</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">品項名稱</label>
                <input type="text" id="itemName" required placeholder="例如：白貼、肌內效、生理食鹽水" class="w-full border rounded-xl p-2.5">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">數量</label>
                    <input type="number" id="qty" required min="1" value="1" class="w-full border rounded-xl p-2.5">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">單位</label>
                    <input type="text" id="unitName" value="卷/個" class="w-full border rounded-xl p-2.5">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">備註說明 (選填)</label>
                <input type="text" id="note" placeholder="例如：場地 A 消耗" class="w-full border rounded-xl p-2.5">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl shadow transition">
                確認送出登記
            </button>
        </form>
    </div>

    <script>
        // 永久寫死您的中央 API 網址
        const FIXED_API_URL = "https://script.google.com/macros/s/AKfycbzVQHj-Uh5FBCi1jl2dfqYCjHpzVhbOohlJC-3vbQ30wa16ij5y5EXGZQj8AsQfhGa7/exec";

        function submitForm(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "資料傳送中...";

            const payload = {
                time: new Date().toLocaleString('zh-TW', { hour12: false }),
                eventName: document.getElementById('eventName').value,
                unit: document.getElementById('unit').value,
                user: document.getElementById('user').value,
                actionType: document.getElementById('actionType').value,
                itemName: document.getElementById('itemName').value,
                qty: document.getElementById('qty').value,
                unitName: document.getElementById('unitName').value,
                note: document.getElementById('note').value,
                _nonce: Date.now()
            };

            // 採用 JSONP 穿透送出，確保手機 100% 寫入試算表
            const cbName = 'tx_cb_' + Math.round(Math.random() * 100000);
            const queryStr = Object.keys(payload).map(k => `${k}=${encodeURIComponent(payload[k])}`).join('&');
            const script = document.createElement('script');
            script.src = `${FIXED_API_URL}?action=add&${queryStr}&callback=${cbName}`;

            window[cbName] = function(res) {
                delete window[cbName];
                document.body.removeChild(script);
                btn.disabled = false;
                btn.innerText = "確認送出登記";
                alert("✅ 登記成功，已即時同步至中央後台！");
                document.getElementById('itemName').value = '';
                document.getElementById('qty').value = '1';
                document.getElementById('note').value = '';
            };

            script.onerror = function() {
                delete window[cbName];
                document.body.removeChild(script);
                btn.disabled = false;
                btn.innerText = "確認送出登記";
                alert("⚠️ 網路異常或傳送失敗，請再試一次。");
            };

            document.body.appendChild(script);
        }
    </script>
</body>
</html>
